transforms:
  - !Sanitize
  - !DeleteFieldsets
      from: .*
      useless: true
  - !CleanDescriptions

  # ===========================================================================
  # LOCKKEY enum merging: the Unlocked/Locked enum appears in LOCK/MASSLOCK/
  # DTLOCK registers across MSC, EMU, RMU, CMU, TIMER, RTCC, GPIO.  Merge
  # into one canonical definition.
  # ===========================================================================

  - !MergeEnums
      from: ".+::vals::.*Lockkey"
      to: "msc::vals::Lockkey"
      check: NoCheck
      skip_unmergeable: true

  # ===========================================================================
  # IFS/IFC fieldset merging: IFC is identical to IFS (same fields, same bit
  # positions, write-only).  Merge IFC into IFS so both registers share one
  # fieldset type.
  # ===========================================================================

  - !MergeFieldsets
      from: "(.+)::regs::If[sc]"
      to: "$1::regs::Ifs"
      main: "(.+)::regs::Ifs"
      check: NoCheck

  # ===========================================================================
  # ADC
  # ===========================================================================

  # ADC0 + ... + ADCn -> adc::Adc
  - !MergeBlocks
      from: adc\d+::Adc\d+
      to: adc::Adc
      check: NoCheck
  - !Rename
      from: "adc0::(.+)"
      to: "adc::$1"
  - !Delete
      from: "adc[0-9].*"

  # ===========================================================================
  # ACMP
  # ===========================================================================

  # ACMP0 + ACMP1 -> acmp::Acmp
  - !MergeBlocks
      from: acmp\d+::Acmp\d+
      to: acmp::Acmp
      check: NoCheck
  - !Rename
      from: "acmp0::(.+)"
      to: "acmp::$1"
  - !Delete
      from: "acmp1.*"
  # Hysteresis0 + Hysteresis1 -> Hysteresis  
  - !MergeFieldsets
      from: "acmp::regs::Hysteresis(\\d+)"
      to: "acmp::regs::Hysteresis"
      check: NoCheck
  # Hysteresis0Hyst + Hysteresis1Hyst -> HysteresisHyst
  - !MergeEnums
      from: "acmp::vals::Hysteresis(\\d+)Hyst"
      to: "acmp::vals::HysteresisHyst"
      check: NoCheck
      skip_unmergeable: true

  # ===========================================================================
  # CMU
  # ===========================================================================

  # make arrays out of multiple clock gating flags for the same peripheral type (e.g. timer0, timer1 -> timer array)
  - !MakeFieldArray
    fieldsets: cmu::regs::Hfperclken0
    from: timer\d+
    to: timer
  - !MakeFieldArray
    fieldsets: cmu::regs::Hfperclken0
    from: usart\d+
    to: usart
  - !MakeFieldArray
    fieldsets: cmu::regs::Hfperclken0
    from: acmp\d+
    to: acmp   
  - !MakeFieldArray
    fieldsets: cmu::regs::Hfperclken0
    from: i2c\d+
    to: i2c
  - !MakeFieldArray
    fieldsets: cmu::regs::Hfperclken0
    from: adc\d+
    to: adc
  - !MakeFieldArray
    fieldsets: cmu::regs::Hfperclken0
    from: idac\d+
    to: idac
  - !MakeFieldArray
    fieldsets: cmu::regs::Lfaclken0
    from: letimer\d+
    to: letimer
  - !MakeFieldArray
    fieldsets: cmu::regs::Lfbclken0
    from: leuart\d+
    to: leuart

  # ===========================================================================
  # GPIO
  # ===========================================================================

  # collapse the 6 flat PA_*..PF_* port register groups into a shared
  # Port block.  MakeBlock extracts them; MergeFieldsets collapses the
  # per-port fieldset copies (PaCtrl, PbCtrl, ... -> Ctrl).
  - !MakeBlock
      blocks: "gpio::Gpio"
      from: "p([a-z])_(.+)"
      to_outer: "port_$1"
      to_inner: "$2"
      to_block: "gpio::Port"
  - !MergeFieldsets
      from: "gpio::regs::P[a-z](.+)"
      to: "gpio::regs::$1"
      main: "gpio::regs::Pa$1"
      check: NoCheck
  # GPIO Ctrl field renames: make the abbreviated names more readable
  - !RenameFields
      fieldset: "gpio::regs::Ctrl"
      from: "drivestrength"
      to: "drive_strength"
  - !RenameFields
      fieldset: "gpio::regs::Ctrl"
      from: "slewrate"
      to: "slew_rate"
  - !RenameFields
      fieldset: "gpio::regs::Ctrl"
      from: "dindis"
      to: "din_dis"
  - !RenameFields
      fieldset: "gpio::regs::Ctrl"
      from: "drivestrengthalt"
      to: "drive_strength_alt"
  - !RenameFields
      fieldset: "gpio::regs::Ctrl"
      from: "slewratealt"
      to: "slew_rate_alt"
  - !RenameFields
      fieldset: "gpio::regs::Ctrl"
      from: "dindisalt"
      to: "din_dis_alt"

  # ===========================================================================
  # I2C
  # ===========================================================================

  # I2C0 + ... + I2Cn -> i2c::I2c
  - !MergeBlocks
      from: i2c\d+::I2c\d+
      to: i2c::I2c
      check: NoCheck
  - !Rename
      from: "i2c0::(.+)"
      to: "i2c::$1"
  - !Delete
      from: "i2c[0-9].*"

  # ===========================================================================
  # IDAC
  # ===========================================================================

  # IDAC0 + ... + IDACn -> idac::Idac
  - !MergeBlocks
      from: idac\d+::Idac\d+
      to: idac::Idac
      check: NoCheck
  - !Rename
      from: "idac0::(.+)"
      to: "idac::$1"
  - !Delete
      from: "idac[0-9].*"

  # ===========================================================================
  # LDMA
  # ===========================================================================

  # collapse the 8 flat CH0_*..CH7_* channel registers into a cluster.
  - !MakeBlock
      blocks: "ldma::Ldma"
      from: "ch(\\d+)_(.+)"
      to_outer: "ch$1"
      to_inner: "$2"
      to_block: "ldma::Channel"
  # 'loop' is a Rust keyword — rename to 'loop_'
  - !RenameRegisters
      block: "ldma::Channel"
      from: "loop"
      to: "loop_"

  # ===========================================================================
  # LETIMER
  # ===========================================================================

  # LETIMER0 + ... + LETIMERn -> letimer::LeTimer
  - !MergeBlocks
      from: letimer\d+::Letimer\d+
      to: letimer::LeTimer
      check: NoCheck
  - !Rename
      from: "letimer0::(.+)"
      to: "letimer::$1"
  - !Delete
      from: "letimer[0-9].*"

  # ===========================================================================
  # LEUART
  # ===========================================================================

  # LEUART0 + ... + LEUARTn -> leuart::LeUart
  - !MergeBlocks
      from: leuart\d+::Leuart\d+
      to: leuart::LeUart
      check: NoCheck
  - !Rename
      from: "leuart0::(.+)"
      to: "leuart::$1"
  - !Delete
      from: "leuart[0-9].*"

  # ===========================================================================
  # PCNT
  # ===========================================================================

  # PCNT0 + ... + PCNTn -> pcnt::Pcnt
  - !MergeBlocks
      from: pcnt\d+::Pcnt\d+
      to: pcnt::Pcnt
      check: NoCheck
  - !Rename
      from: "pcnt0::(.+)"
      to: "pcnt::$1"
  - !Delete
      from: "pcnt[0-9].*"

  # ===========================================================================
  # PRS
  # ===========================================================================
  
  # make arrays out of multiple register fields dealing with PRS channels
  - !MakeFieldArray
    fieldsets: prs::regs::Swpulse
    from: ch(\d+)pulse
    to: ch_pulse
  - !MakeFieldArray
    fieldsets: prs::regs::Swlevel
    from: ch(\d+)level
    to: ch_level
  - !MakeFieldArray
    fieldsets: prs::regs::Routepen
    from: ch(\d+)pen
    to: ch_pen
  - !MakeFieldArray
    fieldsets: prs::regs::Peek
    from: ch(\d+)val
    to: ch_val
  # merge CH0Ctrl,CH1Ctrl...CH11Ctrl fieldsets
  - !MergeFieldsets
      from: "prs::regs::Ch(\\d+)Ctrl"
      to: "prs::regs::ChCtrl"
      main: "prs::regs::ChCtrl"
      check: NoCheck
  # merge Dmareq0, Dmareq1 fieldsets
  - !MergeFieldsets
      from: "prs::regs::Dmareq(\\d+)"
      to: "prs::regs::DmaReq"
      main: "prs::regs::DmaReq"
      check: NoCheck
  # merge CHxCtrl enums (ChCtrlEdsel, ChCtrlSourcesel)
  - !MergeEnums
      from: "prs::vals::Ch(\\d+)Ctrl(.+)"
      to: "prs::vals::ChCtrl$2"
      check: NoCheck
      skip_unmergeable: true
  # Group all ChCtrl registers into an array
  - !MakeRegisterArray
    blocks: prs::Prs
    from: ch\d+_ctrl
    to: ch_ctrl

  # ===========================================================================
  # RTCC
  # ===========================================================================

  # merge CC1/CC2 fieldsets into CC0 (identical layout).  RET0_REG..
  # RET31_REG are plain u32 registers (no fieldset) at distinct offsets, so
  # they cannot be merged into one fieldset and are left as separate
  # registers.
  - !MergeFieldsets
      from: "rtcc::regs::Cc(\\d+)(.+)"
      to: "rtcc::regs::Cc0$2"
      main: "rtcc::regs::Cc0.*"
      check: NoCheck

  # ===========================================================================
  # TIMER
  # ===========================================================================

  # TIMER0 + TIMER1 -> timer::Timer
  - !MergeBlocks
      from: timer\d+::Timer\d+
      to: "timer::Timer"
      check: NoCheck
  - !Rename
      from: "timer0::(.+)"
      to: "timer::$1"
  - !Delete
      from: "timer1.*"
  # TIMER CC: the CC1/CC2/CC3 fieldsets are identical copies of CC0 (same
  # fields and bit positions; only the per-instance enum names differ).  Merge
  # them into CC so all CC channels share one set of fieldset types.  This
  # mirrors the RTCC CC merge below.
  - !MergeFieldsets
      from: "timer::regs::Cc(\\d+)(.+)"
      to: "timer::regs::Cc$2"
      main: "timer::regs::Cc.*"
      check: NoCheck
  # collapse the 4 flat CC0_*..CC3_* channel registers into a cluster.
  - !MakeBlock
      blocks: "timer::Timer"
      from: "cc(\\d+)_(.+)"
      to_outer: "cc$1"
      to_inner: "$2"
      to_block: "timer::Channel"
  # Create a single cc register array with 4 elements
  - !MakeRegisterArray
      blocks: timer::Timer
      from: cc\d+
      to: cc
  # cc0, cc1, cc2, cc3 -> cc array
  # icbof0, icbof1, icbof2, icbof3 -> icbof array
  - !MakeFieldArray
    fieldsets: timer::regs::(If|Ifc|Ifs|Ien)
    from: cc\d+
    to: cc
  - !MakeFieldArray
    fieldsets: timer::regs::(If|Ifc|Ifs|Ien)
    from: icbof\d+
    to: icbof
  # cc0loc, cc1loc, cc2loc, cc3loc -> cc_loc array
  - !MakeFieldArray
    fieldsets: timer::regs::Routeloc0
    from: cc\d+loc
    to: cc_loc
  # cdti0loc, cdti1loc, cdti2loc -> cdti_loc array
  - !MakeFieldArray
    fieldsets: timer::regs::Routeloc2
    from: cdti\d+loc
    to: cdti_loc
  # cc0pen, cc1pen, cc2pen, cc3pen -> cc_pen array
  - !MakeFieldArray
    fieldsets: timer::regs::Routepen
    from: cc\d+pen
    to: cc_pen
  # cdti0pen, cdti1pen, cdti2pen -> cdti_pen array
  - !MakeFieldArray
    fieldsets: timer::regs::Routepen
    from: cdti\d+pen
    to: cdti_pen
  # merge timer channel enums
  - !MergeEnums
      from: "timer::vals::Cc(\\d+)(.+)"
      to: "timer::vals::Cc$2"
      check: NoCheck
      skip_unmergeable: true
  # Fix `CcLoc` name
  - !Rename
      from: "timer::vals::Ccloc"
      to: "timer::vals::CcLoc"

  # ===========================================================================
  # USART0 + USART1 -> usart::Usart
  # ===========================================================================
  
  - !MergeBlocks
      from: usart\d+::Usart\d+
      to: "usart::Usart"
      check: NoCheck
  - !Rename
      from: "usart0::(.+)"
      to: "usart::$1"
  - !Delete
      from: "usart1.*"

  # ===========================================================================
  # WDOG
  # ===========================================================================

  # WDOG0 + ... + WDOGn -> wdog::Wdog
  - !MergeBlocks
      from: wdog\d+::Wdog\d+
      to: wdog::Wdog
      check: NoCheck
  - !Rename
      from: "wdog0::(.+)"
      to: "wdog::$1"
  - !Delete
      from: "wdog[0-9].*"